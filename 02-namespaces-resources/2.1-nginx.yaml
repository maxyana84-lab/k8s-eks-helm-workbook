# Exercise 2.1: nginx for every namespace (no namespace in the file on purpose):
#   kubectl apply -n dev -f 2.1-nginx.yaml     (same for staging and prod)
# The requests are there so that the Pod also fits into the ResourceQuota of 2.2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
