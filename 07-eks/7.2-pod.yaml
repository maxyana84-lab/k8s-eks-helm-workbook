# Exercise 7.2: a Pod that uses the service account and lists the S3 buckets with its role (no access keys anywhere).
#   kubectl apply -f 7.2-pod.yaml && kubectl logs s3-lister
# To see the failure without the role: change serviceAccountName to "default": AccessDenied / no credentials.
apiVersion: v1
kind: Pod
metadata:
  name: s3-lister
spec:
  serviceAccountName: s3-reader
  restartPolicy: Never
  containers:
    - name: aws-cli
      image: amazon/aws-cli:2.17.40
      command: ["aws", "s3", "ls"]
      env:
        - name: AWS_REGION
          value: eu-west-1
