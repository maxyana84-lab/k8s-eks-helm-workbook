# Exercise 3.1: NetworkPolicy in prod: deny all ingress, then allow role=frontend -> role=api on 8080.
apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        role: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=api-ok"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: prod
spec:
  selector:
    role: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  namespace: prod
  labels:
    role: frontend
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
---
# a Pod that must NOT reach the API once the policies are applied
apiVersion: v1
kind: Pod
metadata:
  name: other-pod
  namespace: prod
  labels:
    role: other
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
