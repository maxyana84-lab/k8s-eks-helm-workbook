# Exercise 7.1: EKS cluster dev-cluster in eu-west-1 with a managed node group (2 x t3.medium, autoscaling 1-4).
#   eksctl create cluster -f 7.1-cluster.yaml          (about 15-20 minutes, costs money: see README)
#   aws eks update-kubeconfig --name dev-cluster --region eu-west-1
#   kubectl get nodes
#
# The same file is used by the later exercises: the OIDC provider (7.2), the EBS CSI add-on (7.4) and the
# Cluster Autoscaler tags (7.5) are already here. "version" is left out on purpose: eksctl then creates a release
# that is in standard support; add e.g. version: "1.34" to pin it.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: dev-cluster
  region: eu-west-1

iam:
  withOIDC: true             # 7.2 (IRSA) and every other IAM role for a service account need it

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver # 7.4
    wellKnownPolicies:
      ebsCSIController: true # the IAM role of the driver, created by eksctl

managedNodeGroups:
  - name: ng-main
    instanceType: t3.medium
    minSize: 1
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 20
    # these two tags are what the Cluster Autoscaler (7.5) auto-discovers
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/dev-cluster: "owned"
