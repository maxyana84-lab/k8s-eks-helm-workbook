# Exercise 4.3 (EKS only): EFS with ReadWriteMany. Steps before applying this file:
#   1. install the EFS CSI driver (helm chart aws-efs-csi-driver) with an IRSA role
#   2. create the EFS file system and one mount target per subnet of the nodes (security group: NFS 2049 from the nodes)
#   3. put the file system ID instead of fs-REPLACE_ME below (an ID is not a secret)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-REPLACE_ME
  directoryPerms: "700"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 5Gi
---
# three replicas, all writing to the same shared volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efs-writers
spec:
  replicas: 3
  selector:
    matchLabels:
      app: efs-writers
  template:
    metadata:
      labels:
        app: efs-writers
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(hostname) $(date)\" >> /data/shared.log; sleep 5; done"]
          volumeMounts:
            - name: shared
              mountPath: /data
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: efs-claim
