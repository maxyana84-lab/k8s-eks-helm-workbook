# Exercise 5.1: ServiceAccount deploy-bot in dev, a Role (get/list/watch on Pods and Deployments), a RoleBinding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-bot-reader
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-bot-reader
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: deploy-bot
    namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-bot-reader
