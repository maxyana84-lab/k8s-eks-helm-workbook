# Exercise 6.1: pod anti-affinity spreads the replicas: two Pods with app=spread never share a node.
# With "required" a replica stays Pending when there is no free node; "preferred" would only try to spread.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spread
  template:
    metadata:
      labels:
        app: spread
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: spread
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.25
