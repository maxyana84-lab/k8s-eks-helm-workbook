# Exercise 5.3: satisfies "restricted": non-root, no privilege escalation, all capabilities dropped, seccomp RuntimeDefault.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: prod
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
