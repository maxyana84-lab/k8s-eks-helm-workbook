# Exercise 9.3: "connection refused" when a client calls web-svc. The chain has THREE faults on purpose:
#   (2) the selector of the Service (app: wb) does not match the Pod labels (app: web)         -> no endpoints at all
#   (3) the readiness probe checks port 8081, nginx listens on 80                                -> the Pod is never Ready
#   (5) a NetworkPolicy (9.3-networkpolicy.yaml, applied last) drops the traffic of a client without a label
# Debug in this order:  kubectl get endpoints web-svc -n debug-svc
#                       kubectl get pods -n debug-svc --show-labels ;  kubectl get svc web-svc -n debug-svc -o yaml
#                       kubectl describe pod -n debug-svc -l app=web         (readiness probe failed)
#                       kubectl port-forward -n debug-svc svc/web-svc 8080:80   (bypasses the client and the policies)
#                       kubectl get networkpolicy -n debug-svc
apiVersion: v1
kind: Namespace
metadata:
  name: debug-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: debug-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8081            # fault 3: nginx does not listen here
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: debug-svc
spec:
  selector:
    app: wb                         # fault 2: a typo, the Pods have app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: debug-svc
  labels:
    role: client
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
