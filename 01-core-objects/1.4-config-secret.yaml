# Exercise 1.4: ConfigMap as env vars, Secret as a volume at /etc/secrets
#
# The Secret is NOT in this file on purpose: secrets do not belong in Git.
# Create it before the Pod:
#   kubectl create secret generic app-secret --from-literal=DB_PASSWORD='<value>'
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: production
  LOG_LEVEL: info
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: app-config
      volumeMounts:
        - name: secrets
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: secrets
      secret:
        secretName: app-secret
