# Apply after 3.1-networkpolicy.yaml. NetworkPolicy needs a CNI that enforces it (Calico, Cilium).
# The default CNI of kind and of a plain EKS cluster (VPC CNI without the network policy feature) does not.
# 1) deny all ingress to every Pod of the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2) allow only role=frontend -> role=api on port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: prod
spec:
  podSelector:
    matchLabels:
      role: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
      ports:
        - protocol: TCP
          port: 8080
