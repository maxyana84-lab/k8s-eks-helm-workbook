# Exercise 10.3: all three probe types on an application that starts slowly (20 s before nginx starts).
#  - startupProbe: until it succeeds, the other two probes do not run. 30 failures x 2 s = up to 60 s to start,
#    so a slow start is not killed by the liveness probe.
#  - livenessProbe: HTTP check every 10 s; 3 failures in a row restart the container.
#  - readinessProbe: TCP check; while it fails the Pod is taken out of the Service endpoints (it is not restarted).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-app
  template:
    metadata:
      labels:
        app: slow-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          command: ["sh", "-c", "sleep 20; exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
