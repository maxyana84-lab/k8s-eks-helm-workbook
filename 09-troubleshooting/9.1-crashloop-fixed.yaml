# Exercise 9.1: the fix: the config file exists (here: a ConfigMap mounted at /etc/app) and the app keeps running.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-conf
data:
  app.conf: |
    mode = production
---
apiVersion: v1
kind: Pod
metadata:
  name: crashing
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting app'; cat /etc/app/app.conf || exit 1; sleep 3600"]
      volumeMounts:
        - name: conf
          mountPath: /etc/app
  volumes:
    - name: conf
      configMap:
        name: app-conf
