# Exercise 7.5: values for the autoscaler/cluster-autoscaler Helm chart.
#   eksctl create iamserviceaccount --cluster dev-cluster --region eu-west-1 --namespace kube-system \
#     --name cluster-autoscaler --attach-policy-arn <arn of iam/cluster-autoscaler-policy.json> --approve
#   helm repo add autoscaler https://kubernetes.github.io/autoscaler
#   helm install cluster-autoscaler autoscaler/cluster-autoscaler -n kube-system -f 7.5-cluster-autoscaler-values.yaml
cloudProvider: aws
awsRegion: eu-west-1

autoDiscovery:
  clusterName: dev-cluster   # node groups tagged k8s.io/cluster-autoscaler/dev-cluster are discovered

rbac:
  serviceAccount:
    create: false            # the IRSA service account created by eksctl
    name: cluster-autoscaler

extraArgs:
  balance-similar-node-groups: true
  skip-nodes-with-system-pods: false

# Keep the minor version of the autoscaler equal to the Kubernetes minor version of the cluster
# (check the available tags first), e.g. for 1.34:
# image:
#   tag: v1.34.0
