# Exercise 9.2: a Pod that asks for 64Gi of memory, more than any node has: it stays Pending.
# Diagnose:  kubectl get pod hungry            -> STATUS Pending, NODE <none>
#            kubectl describe pod hungry       -> Events: FailedScheduling ... Insufficient memory
#            kubectl describe nodes | grep -A8 "Allocated resources"     (what the nodes have)
# Other usual causes (see the hint of the workbook): no node matches nodeSelector / affinity, a taint without a toleration,
# a PVC that is not bound.
apiVersion: v1
kind: Pod
metadata:
  name: hungry
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: 64Gi
