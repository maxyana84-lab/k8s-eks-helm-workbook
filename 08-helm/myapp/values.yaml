# Exercise 8.2: image, replicas and environment variables are parameters.
replicaCount: 2

image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent

# Exercise 8.3 (range): every key becomes an environment variable of the container
env:
  APP_ENV: dev
  LOG_LEVEL: info

# the ConfigMap (data of the application), also injected with envFrom
config:
  GREETING: hello from myapp

service:
  type: ClusterIP
  port: 80

# Exercise 8.3 (if): the Ingress exists only when enabled
ingress:
  enabled: false
  className: nginx
  host: myapp.local
  path: /

# Exercise 8.3 (toYaml): copied as it is into the container spec
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Exercise 8.5: hooks
hooks:
  enabled: true
  image: busybox:1.36

# ---------------------------------------------------------------------------
# Exercise 8.6: the PostgreSQL subchart (Bitnami). Off by default: --set postgresql.enabled=true
# ---------------------------------------------------------------------------
global:
  security:
    # Bitnami stopped publishing versioned images under docker.io/bitnami; the same tags live in bitnamilegacy,
    # and the chart refuses another registry unless this flag is set.
    allowInsecureImages: true

postgresql:
  enabled: false
  fullnameOverride: myapp-postgresql
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  auth:
    database: appdb
    username: app
    # The passwords are NOT in Git. Pass them when installing:
    #   --set postgresql.auth.password=... --set postgresql.auth.postgresPassword=...
    # (or use postgresql.auth.existingSecret)
  primary:
    persistence:
      size: 1Gi
